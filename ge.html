<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>სტუმარ-მასპინძელი - ქართული</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f6f8; color: #333; }
        .lang-bar { background-color: #2c3e50; padding: 15px; text-align: right; position: sticky; top: 0; z-index: 100; }
        .lang-bar a { 
            color: white; 
            text-decoration: none; 
            margin-left: 12px; 
            padding: 8px 15px; 
            border: 1px solid white; 
            border-radius: 5px; 
            font-weight: bold;
        }
        .lang-bar a:hover, .lang-bar a.active { background-color: white; color: #2c3e50; }
        .content { max-width: 850px; margin: 35px auto; padding: 25px; background: white; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .post { border-bottom: 1px solid #eee; padding-bottom: 20px; margin-bottom: 25px; }
        .post:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .post img { max-width: 100%; height: auto; border-radius: 5px; }
        .post h2 { color: #2c3e50; margin-top: 0; }
    </style>
</head>
<body>

    <div class="lang-bar">
        <a href="index.html">English</a>
        <a href="ge.html" class="active">ქართული</a>
        <a href="ar.html">العربية</a>
    </div>

    <div class="content">
        <h1>მოგესალმებით — სტუმარ-მასპინძელი</h1>
        <div id="ge-posts">იტვირთება ქართული პოსტები...</div>
    </div>

    <script>
        function renderGeorgianPosts(data) {
            const container = document.getElementById('ge-posts');
            container.innerHTML = '';
            const entries = data.feed.entry || [];
            if (entries.length === 0) {
                container.innerHTML = '<div class="post"><p>ქართული პოსტები ჯერ არ მოიძებნა.</p></div>';
                return;
            }
            entries.forEach(entry => {
                const title = entry.title.$t;
                const body = entry.content ? entry.content.$t : (entry.summary ? entry.summary.$t : '');
                container.innerHTML += `<div class="post"><h2>${title}</h2><div>${body}</div></div>`;
            });
        }
    </script>
    <script src="https://stumar-maspinzeli21.blogspot.com/feeds/posts/default?alt=json-in-script&callback=renderGeorgianPosts"></script>

</body>
</html>
