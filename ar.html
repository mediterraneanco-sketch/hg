<!DOCTYPE html>
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المضيف والضيف</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f4f6f8; color: #333; }
        .lang-bar { background-color: #2c3e50; padding: 15px; text-align: left; position: sticky; top: 0; }
        .lang-bar a { color: white; text-decoration: none; margin-right: 10px; padding: 8px 15px; border: 1px solid white; border-radius: 5px; font-weight: bold; }
        .lang-bar a:hover, .lang-bar a.active { background-color: white; color: #2c3e50; }
        .container { max-width: 850px; margin: 30px auto; padding: 0 15px; }
        .post { background: white; padding: 25px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .post img { max-width: 100%; height: auto; border-radius: 5px; }
        .post h2 { color: #2c3e50; margin-top: 0; }
    </style>
</head>
<body>

    <div class="lang-bar">
        <a href="index.html">English</a>
        <a href="ge.html">ქართული</a>
        <a href="ar.html" class="active">العربية</a>
    </div>

    <div class="container" id="posts">جاري التحميل...</div>

    <script>
        function loadPosts(data) {
            const container = document.getElementById('posts');
            container.innerHTML = '';
            const entries = data.feed.entry || [];
            if (entries.length === 0) {
                container.innerHTML = '<div class="post"><h2>مرحبا بكم في المضيف والضيف</h2><p>لا توجد منشورات بعد.</p></div>';
                return;
            }
            entries.forEach(entry => {
                const title = entry.title.$t;
                const content = entry.content ? entry.content.$t : (entry.summary ? entry.summary.$t : '');
                container.innerHTML += `<div class="post"><h2>${title}</h2><div>${content}</div></div>`;
            });
        }
    </script>
    <script src="https://hostandguestarabic.blogspot.com/feeds/posts/default?alt=json-in-script&callback=loadPosts"></script>
</body>
</html>
